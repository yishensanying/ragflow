include:
  - ./docker-compose-base.yml

services:
  ragflow:
    depends_on:
      mysql:
        condition: service_healthy
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: ragflow-server
    ports:
      - ${SVR_HTTP_PORT}:9380
      - 80:80
      - 443:443
    volumes:
      - ./ragflow-logs:/ragflow/logs
      - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    env_file: .env
    environment:
      - TZ=${TIMEZONE}
      - HF_ENDPOINT=${HF_ENDPOINT}
      - MACOS=${MACOS:-1}
      - LIGHTEN=${LIGHTEN:-1}
      # Flask secret key for session signing
      - SECRET_KEY=${SECRET_KEY:-ragflow-secret-key-default-2025}
      # Session管理配置（优化多进程session共享）
      - RAGFLOW_SESSION_TYPE=${RAGFLOW_SESSION_TYPE:-auto}
      - RAGFLOW_SESSION_TIMEOUT=${RAGFLOW_SESSION_TIMEOUT:-604800}  # 7天，单位秒
      - RAGFLOW_SESSION_DIR=${RAGFLOW_SESSION_DIR:-/tmp/ragflow_sessions}
      # Gunicorn 配置
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - GUNICORN_WORKER_CLASS=${GUNICORN_WORKER_CLASS:-sync}
      - GUNICORN_WORKER_CONNECTIONS=${GUNICORN_WORKER_CONNECTIONS:-1000}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-300}
      - GUNICORN_KEEPALIVE=${GUNICORN_KEEPALIVE:-5}
      - GUNICORN_PRELOAD_APP=${GUNICORN_PRELOAD_APP:-true}
      - GUNICORN_ACCESS_LOG=${GUNICORN_ACCESS_LOG:--}
      - GUNICORN_ERROR_LOG=${GUNICORN_ERROR_LOG:--}
      - GUNICORN_LOG_LEVEL=${GUNICORN_LOG_LEVEL:-info}
    networks:
      - ragflow
    restart: on-failure
    # https://docs.docker.com/engine/daemon/prometheus/#create-a-prometheus-configuration
    # If you're using Docker Desktop, the --add-host flag is optional. This flag makes sure that the host's internal IP gets exposed to the Prometheus container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
